<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whack a Toucan</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(to bottom, #c4e6c5, #80e385);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #LoginBox {
            width: 100%;
            max-width: 460px;
            height: 75vh;
            background-color: #ffffff;
            padding: 30px;
            border: 4px solid #362012;
            border-radius: 4px;
            text-align: center;
        }

        h1 {
            display: inline-block;
            background-color: #ff8c00;
            color: aliceblue;
            border: 4px solid rgb(42, 24, 0);
            border-bottom: 8px solid rgb(42, 24, 0);
            border-radius: 4px;
            padding: 5px 10px; 
            margin: 0;
            font-size: 27px;
            font-weight: 900;
        }
        h2 {
            font-size: large;
            margin-top: 2px;
            color: #361907;
            font-weight: 900;
        }
        p {
            padding-top: 10px;
            font-size: 22px;
            text-align: left;
            font-weight: bold;
            margin-bottom: 3px;
        }
        input {
            width: 100vw;
            max-width: 400px;
            height: 50px;
            border: 3px solid rgb(54, 53, 50);
            border-radius: 4px;
        }
        h3 {
            display: block;
            width: 100%;
            background-color: #21aa06;
            color: aliceblue;
            border: 4px solid rgb(42, 24, 0);
            border-bottom: 8px solid rgb(42, 24, 0);
            border-radius: 6px;
            padding: 10px;
            font-size: 20px;
            font-weight: 900;
            margin-top: 24px;
            cursor: pointer     
        }
        a {
            color: #1a7f05;
            font-weight: bold;
            text-decoration: underline;
            margin-left: 4px;

        }
        #Cadastro {
            margin-top: 20px;
            margin-bottom: 0;
            font-size: 14px;
            color: #333;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="LoginBox">
        <h1>WHACK A TOUCAN</h1>
        <h2>Jogo de acertar a Toupeira</h2>

        <p>Nome (username)</p>
        <input type="text">
        <p>Senha</p>
        <input type="text">

        <h3>ENTRAR</h3>
        <p id="Cadastro">Ainda não tem conta?</p>
        <a href="Cadastro.html">Cadastre-se</a>

    </div>
    
</body>
</html>
